function formPage(){const pct=progress();return `<section class="intro"><div><p class="eyebrow"><span class="field-line"></span> כלי עבודה למדריכים</p><h1>השלב הבא:<br><em>סמן תצפית.</em></h1><p class="intro-copy">עבודה מהירה בשטח: סמן את מה שראית, שמור על רצף השיעור, וסיים עם יעד אחד מעשי.</p></div><div class="session"><div class="session-icon">${icon()}</div><div><span class="session-label">מצב עבודה · שלב ${step==='details'?'01':step==='observe'?'02':'03'}</span><strong>${pct?`תצפית בתהליך · ${Object.keys(draft.statuses).length}/${settings.criteria.length}`:'מוכנים להתחיל'}</strong></div><div class="progress"><i style="width:${pct}%"></i></div><div class="session-meta"><span>0 דק׳</span><span>45 דק׳</span></div></div></section>${nav()}${step==='details'?detailsPage():step==='observe'?observePage():summaryPage()}`}
function detailsPage(){return `<section class="panel"><div class="panel-head"><div><p class="kicker">01 / לפני השיעור</p><h2>פרטי השיעור</h2></div><span class="time">כ־2 דקות</span></div><div class="grid field"><label>שם הסטאז׳ר/ית<div class="search-wrap"><input value="${esc(draft.name)}" onfocus="searchInterns(this.value)" oninput="searchInterns(this.value)" placeholder="חיפוש לפי שם פרטי או משפחה" autocomplete="off"><div id="intern-suggestions"></div></div></label><label>מדריך/ה<input value="${esc(draft.mentor||'')}" readonly placeholder="ישויך אוטומטית לאחר בחירה"></label><label>טלפון<input value="${esc(draft.phone||'')}" readonly placeholder="יתמלא אוטומטית לאחר בחירה"></label><label>תאריך<input type="date" value="${esc(draft.date)}" oninput="setField('date',this.value)"></label><label>שם בית הספר<input value="${esc(draft.school||'')}" readonly placeholder="יתמלא אוטומטית לאחר בחירה"></label><label>סוג בית הספר<input value="${esc(draft.schoolType||'')}" readonly placeholder="יתמלא אוטומטית לאחר בחירה"></label><label>עיר בית הספר<input value="${esc(draft.city||'')}" readonly placeholder="יתמלא אוטומטית לאחר בחירה"></label><label>כיתה<input value="${esc(draft.className||'')}" oninput="setField('className',this.value)" placeholder="למשל: י׳2"></label><label>מספר תלמידים<input type="number" min="0" value="${esc(draft.studentCount||'')}" oninput="setField('studentCount',this.value)" placeholder="למשל: 28"></label><label>נושא השיעור<input value="${esc(draft.topic)}" oninput="setField('topic',this.value)" placeholder="למשל: מסירת כדור בתנועה"></label><label>מקום השיעור<select onchange="setField('lessonPlace',this.value);render()"><option value="">בחירה</option><option value="אולם" ${draft.lessonPlace==='אולם'?'selected':''}>אולם</option><option value="מגרש" ${draft.lessonPlace==='מגרש'?'selected':''}>מגרש</option><option value="אחר" ${draft.lessonPlace==='אחר'?'selected':''}>אחר</option></select>${draft.lessonPlace==='אחר'?`<input value="${esc(draft.lessonPlaceOther||'')}" oninput="setField('lessonPlaceOther',this.value)" placeholder="כתוב את מקום השיעור">`:''}</label><label>מספר שיעור מתוך יחידת ההוראה<select onchange="setField('unitLesson',this.value);render()"><option value="">בחירה</option><option value="1" ${draft.unitLesson==='1'?'selected':''}>1</option><option value="2" ${draft.unitLesson==='2'?'selected':''}>2</option><option value="3" ${draft.unitLesson==='3'?'selected':''}>3</option><option value="4" ${draft.unitLesson==='4'?'selected':''}>4</option><option value="5" ${draft.unitLesson==='5'?'selected':''}>5</option><option value="לא צוין" ${draft.unitLesson==='לא צוין'?'selected':''}>לא צוין</option><option value="אחר" ${draft.unitLesson==='אחר'?'selected':''}>אחר</option></select>${draft.unitLesson==='אחר'?`<input value="${esc(draft.unitLessonOther||'')}" oninput="setField('unitLessonOther',this.value)" placeholder="כתוב מספר או תיאור אחר">`:''}</label></div><div class="upload-box"><div><strong>מערך שיעור</strong><span>אפשר להעלות PDF, Word, PowerPoint או קובץ טקסט</span></div>${draft.lessonFile?`<div class="file-chip"><span>${esc(draft.lessonFile.name)} · ${formatSize(draft.lessonFile.size)}</span><button type="button" onclick="removeLessonFile()">הסרה</button></div>`:'<label class="upload-button">בחירת קובץ<input type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.odt,.txt,.md" onchange="attachLessonFile(this.files[0])"></label>'}</div><label class="field wide">מטרת השיעור<textarea rows="3" oninput="setField('goal',this.value)" placeholder="מה התלמידים אמורים לדעת או לבצע בסיום?">${esc(draft.goal)}</textarea></label><button class="primary next" onclick="setStep('observe')">התחלת תצפית ←</button></section>`}
function grouped(){return settings.criteria.reduce((a,c)=>{(a[c.section]??=[]).push(c);return a},{})}
function observePage(){let groups=grouped();let body=Object.entries(groups).map(([section,items])=>`<div class="section-title">${esc(section)}</div>${items.map((c,i)=>criterion(c,i)).join('')}`).join('');return `<section><div class="observe-head"><div><p class="kicker">02 / בזמן השיעור</p><h2>סמן. המשך לצפות.</h2></div><div class="legend"><span><i class="dot good"></i>מתקיים</span><span><i class="dot watch"></i>חיזוק</span><span><i class="dot urgent"></i>טיפול</span></div></div>${body}<div class="bottom"><button class="secondary" onclick="setStep('details')">→ פרטי שיעור</button><button class="primary" onclick="setStep('summary')">סיכום ומשוב ←</button></div></section>`}
function criterion(c,i){const selected=draft.statuses[c.id]||'';return `<article class="criterion ${selected?'is-'+selected:''}"><div class="criterion-top"><span class="number">${String(i+1).padStart(2,'0')}</span><div><h3>${esc(c.title)}</h3><p>${esc(c.hint)}</p></div></div><div class="status-row">${[['good','מתקיים'],['watch','חיזוק'],['urgent','טיפול']].map(([s,label])=>`<button class="status ${selected===s?'selected':''}" onclick="setStatus('${c.id}','${s}')"><i class="dot ${s}"></i>${label}</button>`).join('')}</div><input class="quick-note" value="${esc(draft.notes[c.id]||'')}" oninput="setNote('${c.id}',this.value)" placeholder="הערה קצרה — מה ראית בפועל?"></article>`}
function summaryPage(){const pct=progress(),urgent=Object.values(draft.statuses).filter(x=>x==='urgent').length;return `<section><div class="summary-hero"><div><p class="kicker">03 / אחרי השיעור</p><h2>תמונה ברורה<br><em>להמשך הדרך.</em></h2><p>המשוב הטוב ביותר נשען על שתי ראיות ועל יעד אחד שאפשר לבצע כבר בשיעור הבא.</p></div><div class="ring"><strong>${pct}%</strong><span>הושלם</span></div></div><div class="summary-grid"><div class="panel summary-panel"><div class="panel-head"><div><p class="kicker">הערות מדריך</p><h2>משוב קצר ומעשי</h2></div></div><label class="field">${esc(settings.feedback.strengthsLabel)}<textarea rows="3" oninput="setField('strengths',this.value)" placeholder="${esc(settings.feedback.strengthsPlaceholder)}">${esc(draft.strengths)}</textarea></label><label class="field">${esc(settings.feedback.improvementLabel)}<textarea rows="3" oninput="setField('improvement',this.value)" placeholder="${esc(settings.feedback.improvementPlaceholder)}">${esc(draft.improvement)}</textarea></label><label class="field">${esc(settings.feedback.nextGoalLabel)}<textarea rows="3" oninput="setField('nextGoal',this.value)" placeholder="${esc(settings.feedback.nextGoalPlaceholder)}">${esc(draft.nextGoal)}</textarea></label></div><aside class="summary-side"><div class="attached-summary">${draft.lessonFile?`<strong>מערך שיעור מצורף</strong><span>${esc(draft.lessonFile.name)} · ${formatSize(draft.lessonFile.size)}</span><button class="secondary" onclick="downloadLessonFile()">הורדת הקובץ</button>`:'<strong>אין מערך שיעור מצורף</strong><span>אפשר להוסיף אותו בשלב פרטי השיעור.</span>'}</div><div class="stat"><span>מדדים שסומנו</span><strong>${Object.keys(draft.statuses).length}<small> / ${settings.criteria.length}</small></strong><div class="progress"><i style="width:${pct}%"></i></div></div><div class="stat"><span>דורשים תשומת לב</span><strong style="color:${urgent?'var(--red)':'inherit'}">${urgent}</strong><p>${urgent?'כדאי להתייחס אליהם בשיחת המשוב.':'אין מדדים שסומנו כטיפול.'}</p></div><div class="safety"><div class="safety-icon">!</div><p><strong>זכור:</strong> אירוע בטיחותי או יחס בלתי הולם מחייבים התייחסות נפרדת, גם אם הציון הכללי גבוה.</p></div></aside></div><div class="bottom"><button class="secondary" onclick="setStep('observe')">→ חזרה לתצפית</button><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="secondary" onclick="exportPDF()">PDF</button><button class="secondary" onclick="shareWhatsapp()">WhatsApp</button><button class="primary" onclick="saveObservation()">שמירת תצפית</button></div></div></section>`}
function aggregateStats(list,key){const map={};list.forEach(x=>{const label=key(x)||'לא שויך';if(!map[label])map[label]={label,count:0,total:0,attention:0};const count=Object.keys(x.statuses||{}).length;const pct=Math.round(count/settings.criteria.length*100);map[label].count+=1;map[label].total+=pct;map[label].attention+=Object.values(x.statuses||{}).filter(s=>s==='watch'||s==='urgent').length});return Object.values(map).map(x=>({...x,avg:Math.round(x.total/x.count)})).sort((a,b)=>b.count-a.count||b.avg-a.avg)}
function statRows(rows){return rows.length?rows.map(x=>`<div class="stats-row"><div class="stats-row-top"><strong>${esc(x.label)}</strong><span>${x.count} תצפיות · ${x.avg}%</span></div><div class="bar-track"><i style="width:${x.avg}%"></i></div><small>${x.attention} מדדי חיזוק/טיפול</small></div>`).join(''):'<div class="stats-empty">אין מספיק נתונים להצגה.</div>'}
function statsBlock(list){const total=list.length;const completion=total?Math.round(list.reduce((sum,x)=>sum+Math.round(Object.keys(x.statuses||{}).length/settings.criteria.length*100),0)/total):0;const attention=list.reduce((sum,x)=>sum+Object.values(x.statuses||{}).filter(s=>s==='watch'||s==='urgent').length,0);const urgent=list.reduce((sum,x)=>sum+Object.values(x.statuses||{}).filter(s=>s==='urgent').length,0);const mentors=aggregateStats(list,x=>x.mentor);const interns=aggregateStats(list,x=>x.name);return `<div class="stats-panel"><div class="stats-title"><div><h3>לוח סיכום תצפיות</h3><p>הסיכום מתעדכן לפי החיפוש וטווח התאריכים שבחרת.</p></div><span class="time">${total} תצפיות</span></div><div class="stats-cards"><div class="stat-card"><span>תצפיות</span><strong>${total}</strong></div><div class="stat-card"><span>השלמת מדדים ממוצעת</span><strong>${completion}%</strong></div><div class="stat-card"><span>מדדי חיזוק/טיפול</span><strong>${attention}</strong></div><div class="stat-card"><span>מדדי טיפול</span><strong style="color:${urgent?'var(--red)':'var(--ink)'}">${urgent}</strong></div></div><div class="stats-columns"><div class="stats-column"><h4>לפי מדריך/ה</h4>${statRows(mentors)}</div><div class="stats-column"><h4>לפי סטאז׳ר/ית</h4>${statRows(interns)}</div></div></div>`}
function csvCell(value){const text=String(value??'').replace(/"/g,'""');return `"${text}"`}
function exportExcel(){if(!history.length){alert('אין עדיין תצפיות לייצוא.');return}const rows=history.map(x=>{const count=Object.keys(x.statuses||{}).length;const pct=Math.round(count/settings.criteria.length*100);const row={'תאריך':x.date||'','שם הסטאז׳ר/ית':x.name||'','מדריך/ה':x.mentor||'','טלפון':x.phone||'','שם בית הספר':x.school||'','סוג בית הספר':x.schoolType||'','עיר בית הספר':x.city||'','כיתה':x.className||'','מספר תלמידים':x.studentCount||'','נושא השיעור':x.topic||'','מקום השיעור':x.lessonPlace==='אחר'?(x.lessonPlaceOther||'אחר'):(x.lessonPlace||''),'מספר שיעור ביחידת ההוראה':x.unitLesson==='אחר'?(x.unitLessonOther||'אחר'):(x.unitLesson||''),'מערך שיעור':x.lessonFile?.name||'','השלמת מדדים':`${pct}%`,'מדדים שסומנו':count,'מדדי חיזוק':Object.values(x.statuses||{}).filter(s=>s==='watch').length,'מדדי טיפול':Object.values(x.statuses||{}).filter(s=>s==='urgent').length,'חוזקות':x.strengths||'','נקודת שיפור':x.improvement||'','יעד לשיעור הבא':x.nextGoal||''};settings.criteria.forEach(c=>{row[`${c.title} — סטטוס`]=x.statuses?.[c.id]||'';row[`${c.title} — הערה`]=x.notes?.[c.id]||''});return row});const filename=`תצפיות_חנ״ג_${new Date().toISOString().slice(0,10)}`;if(window.XLSX){const ws=XLSX.utils.json_to_sheet(rows);ws['!cols']=Object.keys(rows[0]).map(()=>({wch:22}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'תצפיות');XLSX.writeFile(wb,`${filename}.xlsx`);notify('קובץ Excel נוצר בהצלחה');return}const headers=Object.keys(rows[0]);const csv='\uFEFF'+[headers,...rows.map(row=>headers.map(h=>row[h]??''))].map(line=>line.map(csvCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${filename}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('קובץ CSV נוצר בהצלחה — ניתן לפתוח אותו ב־Excel')}
function historyPage(){const list=history.filter(x=>{const n=(x.name||'').toLowerCase().includes(historyQuery.toLowerCase());const d=(!historyFrom||x.date>=historyFrom)&&(!historyTo||x.date<=historyTo);return n&&d});return `<section class="panel"><div class="history-head"><div><p class="kicker">ארכיון תצפיות</p><h2>היסטוריה</h2><p>כל התצפיות שנשמרו במכשיר הזה.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" onclick="exportExcel()">ייצוא Excel</button><button class="secondary" onclick="loadCloudHistory()">סנכרון ענן</button><button class="primary" onclick="newObservation()">+ תצפית חדשה</button></div></div><div class="filter"><input placeholder="חיפוש לפי שם סטאז׳ר/ית" value="${esc(historyQuery)}" oninput="filterHistory('query',this.value)"><input type="date" value="${esc(historyFrom)}" onchange="filterHistory('from',this.value)" aria-label="מתאריך"><input type="date" value="${esc(historyTo)}" onchange="filterHistory('to',this.value)" aria-label="עד תאריך"></div>${statsBlock(list)}<div class="history-list">${list.length?list.map(historyCard).join(''):'<div class="empty">אין עדיין תצפיות התואמות לחיפוש.<br>לאחר שמירת תצפית היא תופיע כאן.</div>'}</div></section>`}
function historyCard(x){const count=Object.keys(x.statuses||{}).length;const p=Math.round(count/settings.criteria.length*100);return `<article class="history-card"><div><h3>${esc(x.name||'ללא שם')}</h3><p>${esc(x.date||'')} · ${esc(x.className||'')} · ${esc(x.topic||'')} · מדריך/ה: ${esc(x.mentor||'לא שויך')} · ${esc(x.schoolType||'')} · ${esc(x.lessonPlace==='אחר'?(x.lessonPlaceOther||'אחר'):x.lessonPlace||'מקום לא צוין')}${x.lessonFile?' · מערך מצורף':''}</p></div><div class="mini-score"><strong>${p}%</strong><span>${count}/${settings.criteria.length} מדדים</span></div><div style="display:flex;gap:7px"><button class="secondary" onclick="loadObservation('${x.id}')">פתיחה</button><button class="secondary" onclick="deleteObservation('${x.id}')">מחיקה</button></div></article>`}
function settingsPage(){return `<section class="panel settings"><p class="kicker">התאמה אישית</p><h2>הגדרות הטופס</h2><p class="settings-intro">ערוך את שמות המדדים, טקסטי העזר והניסוחים שיופיעו למדריך בזמן המילוי. השינויים נשמרים במכשיר וישפיעו על תצפיות חדשות וקיימות בתצוגה.</p><div class="settings-group"><h3>מדדי התצפית</h3>${settings.criteria.map((c,i)=>`<div class="settings-item"><div class="settings-number">מדד ${String(i+1).padStart(2,'0')}</div><div class="settings-grid"><label>שם המדד<input value="${esc(c.title)}" oninput="setSettingCriterion(${i},'title',this.value)"></label><label>טקסט עזר<input value="${esc(c.hint)}" oninput="setSettingCriterion(${i},'hint',this.value)"></label></div></div>`).join('')}</div><div class="settings-group"><h3>שמירת נתונים</h3><p class="settings-intro" style="margin-bottom:14px">כברירת מחדל הנתונים נשמרים במכשיר. אפשר להגדיר כתובת API של השירות שלך כדי לשלוח ולקבל תצפיות בענן. אין לשמור כאן מפתחות סודיים; השתמש באימות בצד השרת.</p><label>כתובת API בסיסית<input value="${esc(settings.cloud?.baseUrl||'')}" oninput="setCloud('baseUrl',this.value)" placeholder="https://example.com/api"></label><label style="display:flex;align-items:center;gap:8px;margin-top:14px"><input style="width:auto;margin:0" type="checkbox" ${settings.cloud?.autoSync?'checked':''} onchange="setCloud('autoSync',this.checked)"> סנכרון אוטומטי בעת שמירת תצפית</label><div style="margin-top:12px;padding:12px;border-radius:11px;background:#f8f3ea;color:var(--ink-soft);font-size:12px;line-height:1.5">החיבור משתמש ב־<strong>GET /observations</strong> לקריאה וב־<strong>POST /observations</strong> לשמירה. בשלב זה מערך השיעור נשמר מקומית; ל־API נשלחים פרטי הקובץ בלבד.</div></div><div class="settings-group"><h3>נוסחי המשוב</h3><div class="settings-grid"><label>כותרת חוזקות<input value="${esc(settings.feedback.strengthsLabel)}" oninput="setFeedback('strengthsLabel',this.value)"></label><label>טקסט עזר לחוזקות<input value="${esc(settings.feedback.strengthsPlaceholder)}" oninput="setFeedback('strengthsPlaceholder',this.value)"></label><label>כותרת נקודת שיפור<input value="${esc(settings.feedback.improvementLabel)}" oninput="setFeedback('improvementLabel',this.value)"></label><label>טקסט עזר לנקודת שיפור<input value="${esc(settings.feedback.improvementPlaceholder)}" oninput="setFeedback('improvementPlaceholder',this.value)"></label><label>כותרת יעד<input value="${esc(settings.feedback.nextGoalLabel)}" oninput="setFeedback('nextGoalLabel',this.value)"></label><label>טקסט עזר ליעד<input value="${esc(settings.feedback.nextGoalPlaceholder)}" oninput="setFeedback('nextGoalPlaceholder',this.value)"></label></div></div><div class="bottom"><button class="secondary" onclick="resetSettings()">איפוס לברירת מחדל</button><button class="primary" onclick="saveSettings()">שמירת הגדרות</button></div></section>`}
function render(){shell(view==='form'?formPage():view==='history'?historyPage():settingsPage())}
function go(v){view=v;if(v==='form')step='details';render()}
function setStep(s){step=s;view='form';render();window.scrollTo({top:0,behavior:'smooth'})}
function normalizeText(value){return String(value||'').trim().toLocaleLowerCase('he-IL').replace(/[׳״]/g,'').replace(/\s+/g,' ')}
function searchInterns(query){const box=document.getElementById('intern-suggestions');if(!box)return;const q=normalizeText(query);const matches=INTERN_DATA.filter(x=>!q||normalizeText(x.fullName).includes(q)||normalizeText(x.firstName).includes(q)||normalizeText(x.lastName).includes(q)).slice(0,8);box.innerHTML=matches.map(x=>`<button type=\"button\" onclick=\"chooseIntern('${x.id}')\"><strong>${esc(x.fullName)}</strong><small>מדריך/ה: ${esc(x.mentor)} · ${esc(x.school||'')}</small></button>`).join('')}
function chooseIntern(id){const intern=INTERN_DATA.find(x=>x.id===id);if(!intern)return;draft.internId=intern.id;draft.name=intern.fullName;draft.mentor=intern.mentor;draft.phone=intern.phone||'';draft.school=intern.school||'';draft.schoolType=intern.schoolType||'';draft.city=intern.city||'';write('pe-draft',draft);render();toast(`נבחר/ה ${intern.fullName} · מדריך/ה ${intern.mentor}`)}
function setField(k,v){draft[k]=v;write('pe-draft',draft)}
function formatSize(bytes){if(!bytes)return '0 KB';return bytes<1048576?Math.round(bytes/1024)+' KB':(bytes/1048576).toFixed(1)+' MB'}
function attachLessonFile(file){if(!file)return;if(file.size>5*1024*1024){toast('הקובץ גדול מדי. ניתן להעלות עד 5MB');return}const reader=new FileReader();reader.onload=()=>{draft.lessonFile={name:file.name,size:file.size,type:file.type,data:reader.result};write('pe-draft',draft);render();toast('מערך השיעור צורף לתצפית')};reader.readAsDataURL(file)}
function removeLessonFile(){draft.lessonFile=null;write('pe-draft',draft);render();toast('מערך השיעור הוסר')}
function downloadLessonFile(){if(!draft.lessonFile)return;const a=document.createElement('a');a.href=draft.lessonFile.data;a.download=draft.lessonFile.name;a.click()}
function setStatus(id,s){draft.statuses[id]=draft.statuses[id]===s?undefined:s;if(!draft.statuses[id])delete draft.statuses[id];write('pe-draft',draft);render()}
function setNote(id,v){draft.notes[id]=v;write('pe-draft',draft)}
function saveDraft(){write('pe-draft',draft);toast('הטיוטה נשמרה במכשיר')}
function newObservation(){draft=blankDraft();write('pe-draft',draft);view='form';step='details';render();toast('נפתחה תצפית חדשה')}
async function saveObservation(){if(!draft.name.trim()){toast('נא למלא שם סטאז׳ר/ית לפני השמירה');return}const item={...draft,id:Date.now().toString(),savedAt:new Date().toISOString()};history=[item,...history.filter(x=>x.id!==item.id)];write('pe-history',history);try{if(settings.cloud?.autoSync&&settings.cloud.baseUrl){await syncToCloud(item);toast('התצפית נשמרה מקומית ובענן')}else{toast('התצפית נשמרה בהיסטוריה המקומית')}}catch(e){toast('נשמר מקומית; הסנכרון לענן נכשל')}setTimeout(()=>{view='history';render()},650)}
function loadObservation(id){const x=history.find(v=>v.id===id);if(!x)return;draft={...x,statuses:{...x.statuses},notes:{...x.notes}};write('pe-draft',draft);view='form';step='summary';render()}
function deleteObservation(id){if(!confirm('למחוק את התצפית מההיסטוריה?'))return;history=history.filter(x=>x.id!==id);write('pe-history',history);render();toast('התצפית נמחקה')}
function filterHistory(k,v){if(k==='query')historyQuery=v;if(k==='from')historyFrom=v;if(k==='to')historyTo=v;render()}
function setSettingCriterion(i,k,v){settings.criteria[i][k]=v}
function setFeedback(k,v){settings.feedback[k]=v}
function setCloud(k,v){settings.cloud=settings.cloud||{baseUrl:'',autoSync:false};settings.cloud[k]=v}
async function syncToCloud(item){if(!settings.cloud?.baseUrl) return false;const base=settings.cloud.baseUrl.replace(/\/$/,'');const payload={...item,lessonFile:item.lessonFile?{name:item.lessonFile.name,size:item.lessonFile.size,type:item.lessonFile.type}:null};const response=await fetch(base+'/observations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!response.ok)throw new Error('Cloud save failed');return true}
async function loadCloudHistory(){if(!settings.cloud?.baseUrl){toast('הגדר כתובת API במסך ההגדרות');return}try{toast('טוען תצפיות מהענן…');const base=settings.cloud.baseUrl.replace(/\/$/,'');const response=await fetch(base+'/observations');if(!response.ok)throw new Error('Cloud load failed');const cloudItems=await response.json();if(!Array.isArray(cloudItems))throw new Error('Invalid response');history=[...cloudItems,...history.filter(local=>!cloudItems.some(cloud=>cloud.id===local.id))];write('pe-history',history);render();toast(`${cloudItems.length} תצפיות נטענו מהענן`)}catch(e){toast('לא ניתן לטעון מהענן; הנתונים המקומיים נשמרו')}}
function saveSettings(){write('pe-settings',settings);render();toast('ההגדרות נשמרו')}
function resetSettings(){if(!confirm('לאפס את כל המדדים ונוסחי המשוב לברירת המחדל?'))return;settings=JSON.parse(JSON.stringify(defaultSettings));write('pe-settings',settings);render();toast('ההגדרות אופסו')}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>el.classList.remove('show'),2400)}
function pdfData(){const statusLabel={good:'מתקיים היטב',watch:'דורש חיזוק',urgent:'דורש טיפול'};return `<div style="display:flex;justify-content:space-between;align-items:flex-start"><div><p style="margin:0;color:#2f8f68;font-weight:800;font-size:12px;letter-spacing:.1em">כלי עבודה למדריכים</p><h1>סיכום תצפית חנ״ג</h1><p style="margin:0;color:#607378">מגרש שקט · שיעור תיכון בן 45 דקות</p></div><div style="color:#2f8f68;font-weight:800">${new Date().toLocaleDateString('he-IL')}</div></div><div class="pdf-meta"><div class="pdf-row"><strong>סטאז׳ר/ית</strong><span>${esc(draft.name)||'—'}</span></div><div class="pdf-row"><strong>מדריך/ה</strong><span>${esc(draft.mentor)||'—'}</span></div><div class="pdf-row"><strong>טלפון</strong><span>${esc(draft.phone)||'—'}</span></div><div class="pdf-row"><strong>בית ספר</strong><span>${esc(draft.school)||'—'}</span></div><div class="pdf-row"><strong>סוג בית ספר</strong><span>${esc(draft.schoolType)||'—'}</span></div><div class="pdf-row"><strong>עיר</strong><span>${esc(draft.city)||'—'}</span></div><div class="pdf-row"><strong>תאריך השיעור</strong><span>${esc(draft.date)||'—'}</span></div><div class="pdf-row"><strong>כיתה</strong><span>${esc(draft.className)||'—'}</span></div><div class="pdf-row"><strong>מספר תלמידים</strong><span>${esc(draft.studentCount)||'—'}</span></div><div class="pdf-row"><strong>מקום שיעור</strong><span>${esc(draft.lessonPlace==='אחר'?(draft.lessonPlaceOther||'אחר'):draft.lessonPlace)||'—'}</span></div><div class="pdf-row"><strong>שיעור ביחידת ההוראה</strong><span>${esc(draft.unitLesson==='אחר'?(draft.unitLessonOther||'אחר'):draft.unitLesson)||'—'}</span></div><div class="pdf-row"><strong>נושא</strong><span>${esc(draft.topic)||'—'}</span></div><div class="pdf-row"><strong>מטרת השיעור</strong><span>${esc(draft.goal)||'—'}</span></div></div><h2 style="font-size:20px;margin:20px 0 6px">מדדי התצפית</h2>${settings.criteria.map((c,i)=>`<div class="pdf-criterion"><strong>${String(i+1).padStart(2,'0')}. ${esc(c.title)}</strong><span>${draft.statuses[c.id]?statusLabel[draft.statuses[c.id]]:'לא סומן'}${draft.notes[c.id]?' · '+esc(draft.notes[c.id]):''}</span></div>`).join('')}<div class="pdf-summary"><h2>${esc(settings.feedback.strengthsLabel)}</h2><p>${esc(draft.strengths)||'—'}</p><h2>${esc(settings.feedback.improvementLabel)}</h2><p>${esc(draft.improvement)||'—'}</p><h2>${esc(settings.feedback.nextGoalLabel)}</h2><p>${esc(draft.nextGoal)||'—'}</p></div>`}
async function makePDF(){const sheet=document.getElementById('pdf-sheet');sheet.innerHTML=pdfData();const canvas=await html2canvas(sheet,{scale:2,backgroundColor:'#fffdf9',useCORS:true});const img=canvas.toDataURL('image/png');const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'p',unit:'mm',format:'a4'});const pageW=210,pageH=297;const imgH=canvas.height*pageW/canvas.width;let y=0;while(y<imgH){if(y>0)pdf.addPage();pdf.addImage(img,'PNG',0,-y,pageW,imgH);y+=pageH}return pdf}
async function exportPDF(){try{toast('מכין קובץ PDF…');const pdf=await makePDF();pdf.save(`סיכום-תצפית-${draft.name||'חנג'}.pdf`);toast('קובץ ה־PDF הורד בהצלחה')}catch(e){toast('לא ניתן ליצור PDF בדפדפן זה')}}
async function shareWhatsapp(){try{toast('מכין קובץ לשיתוף…');const pdf=await makePDF();const blob=pdf.output('blob');const filename=`סיכום-תצפית-${draft.name||'חנג'}.pdf`;const file=new File([blob],filename,{type:'application/pdf'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:'סיכום תצפית חנ״ג',text:`סיכום תצפית עבור ${draft.name||'הסטאז׳ר/ית'}`,files:[file]});return}const phone=(draft.phone||'').replace(/[^0-9]/g,'').replace(/^0/,'972');const text=encodeURIComponent(`שלום ${draft.name||''}, מצורף סיכום התצפית בשיעור החנ״ג.`);window.open(phone?`https://wa.me/${phone}?text=${text}`:`https://wa.me/?text=${text}`,'_blank');pdf.save(filename);toast('WhatsApp נפתח; הקובץ נשמר לצירוף') }catch(e){toast('השיתוף בוטל או אינו נתמך; אפשר להוריד PDF במקום')}}
render();
</script>
</body>
