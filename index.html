<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5efe4">
    <title>מגרש שקט · תצפית חנ״ג</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <style>
        /* Design: מגרש שקט — quiet-court functionalism, RTL, field-green status cues and one-tap mobile actions. */
        :root {
            --ink: #18333b;
            --ink-soft: #607378;
            --sand: #f5efe4;
            --paper: #fffdf9;
            --line: #e7ded0;
            --green: #2f8f68;
            --green-soft: #e3f1e9;
            --amber: #d58a28;
            --amber-soft: #fff0d7;
            --red: #c9554d;
            --red-soft: #fbe6e2;
            --shadow: 0 18px 48px rgba(41, 55, 58, .08);
            --radius: 18px
        }
        * {
            box-sizing: border-box
        }
        body {
            margin: 0;
            background: radial-gradient(circle at 8% 0%, rgba(255, 255, 255, .82), transparent 32rem), var(--sand);
            color: var(--ink);
            font-family: Assistant, Arial, sans-serif
        }
        button,
        input,
        textarea {
            font: inherit
        }
        button {
            cursor: pointer
        }
        button:active {
            transform: scale(.975)
        }
        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
            outline: 3px solid rgba(47, 143, 104, .28);
            outline-offset: 2px
        }
        .app {
            min-height: 100vh
        }
        .supervision-logo {
            display: block;
            width: 124px;
            max-width: 30vw;
            height: 46px;
            object-fit: contain;
            object-position: right center;
            filter: drop-shadow(0 2px 3px rgba(24, 51, 59, .10))
        }
        .brand-divider {
            width: 1px;
            height: 34px;
            background: var(--line);
            margin: 0 12px
        }
        .brand {
            gap: 0 !important
        }
        .brand>div:last-child {
            margin-right: 0
        }
        @media(max-width:700px) {
            .supervision-logo {
                width: 92px;
                height: 36px;
                max-width: 38vw
            }
            .brand-divider {
                height: 30px;
                margin: 0 8px
            }
            .brand>div:last-child strong {
                font-size: 14px
            }
            .brand>div:last-child span {
                font-size: 9px
            }
        }
        .topbar {
            height: 70px;
            position: sticky;
            top: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(16px, 5vw, 72px);
            background: rgba(245, 239, 228, .88);
            border-bottom: 1px solid rgba(231, 222, 208, .85);
            backdrop-filter: blur(14px)
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px
        }
        .mark {
            width: 39px;
            height: 39px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: var(--green);
            color: white
        }
        .mark svg {
            width: 27px;
            height: 27px
        }
        .brand strong {
            display: block;
            font: 700 16px Rubik, Arial
        }
        .brand span {
            display: block;
            margin-top: 2px;
            color: var(--ink-soft);
            font-size: 12px
        }
        .header-actions {
            display: flex;
            gap: 8px
        }
        .header-actions button,
        .save-btn,
        .primary,
        .secondary {
            border-radius: 11px;
            padding: 10px 14px;
            font-weight: 800;
            transition: .18s ease
        }
        .header-actions button {
            border: 1px solid var(--line);
            background: var(--paper);
            color: var(--ink)
        }
        .save-btn {
            border: 0;
            background: var(--ink);
            color: white
        }
        .header-actions .active-nav {
            background: var(--green);
            border-color: var(--green);
            color: white
        }
        .main {
            max-width: 1100px;
            margin: auto;
            padding: 48px clamp(16px, 4vw, 46px) 30px
        }
        .intro {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 30px;
            padding-bottom: 33px
        }
        .eyebrow,
        .kicker {
            margin: 0 0 12px;
            color: var(--green);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .09em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px
        }
        .field-line {
            display: inline-block;
            width: 29px;
            height: 2px;
            position: relative;
            background: var(--green)
        }
        .field-line:after {
            content: "";
            position: absolute;
            left: -1px;
            top: -2px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green)
        }
        h1,
        h2,
        h3,
        p {
            margin-top: 0
        }
        h1,
        h2 {
            font-family: Rubik, Arial, sans-serif;
            letter-spacing: -.055em
        }
        h1 {
            font-size: clamp(38px, 6vw, 72px);
            line-height: 1.01;
            margin: 0;
            font-weight: 800
        }
        h1 em,
        h2 em {
            font-style: normal;
            color: var(--green)
        }
        .intro-copy {
            max-width: 430px;
            margin: 17px 0 0;
            color: var(--ink-soft);
            font-size: 17px;
            line-height: 1.5
        }
        .session {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 11px;
            min-width: 270px;
            max-width: 300px;
            padding: 15px 17px;
            background: rgba(255, 253, 249, .75);
            border: 1px solid var(--line);
            border-radius: 16px
        }
        .session-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: var(--green-soft);
            color: var(--green)
        }
        .session-label {
            color: var(--ink-soft);
            font-size: 12px
        }
        .session strong {
            display: block;
            font-size: 15px;
            margin-top: 2px
        }
        .session-meta {
            width: 100%;
            display: flex;
            justify-content: space-between;
            color: #9aa6a2;
            font-size: 11px;
            margin-top: -4px
        }
        .progress {
            width: 100%;
            height: 5px;
            border-radius: 9px;
            background: #e7e0d6;
            overflow: hidden
        }
        .progress i {
            display: block;
            height: 100%;
            border-radius: inherit;
            background: var(--green);
            transition: width .25s ease
        }
        .nav {
            display: flex;
            align-items: center;
            gap: 3px;
            margin-bottom: 27px;
            border-bottom: 1px solid var(--line);
            overflow: auto;
            scrollbar-width: none;
            background: linear-gradient(90deg, transparent 0 2%, rgba(47, 143, 104, .05) 2% 3%, transparent 3% 97%, rgba(47, 143, 104, .05) 97% 98%, transparent 98%)
        }
        .nav button {
            position: relative;
            white-space: nowrap;
            border: 0;
            background: transparent;
            color: #889698;
            padding: 12px 13px 14px;
            font-weight: 800
        }
        .nav button.active {
            color: var(--ink)
        }
        .nav button.active:after {
            content: "";
            position: absolute;
            right: 8px;
            left: 8px;
            bottom: -1px;
            height: 3px;
            border-radius: 3px 3px 0 0;
            background: var(--green)
        }
        .nav b {
            font: 700 11px Rubik;
            color: #aab6b4;
            margin-left: 6px
        }
        .nav .active b {
            color: var(--green)
        }
        .panel {
            background: var(--paper);
            border: 1px solid rgba(231, 222, 208, .9);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: clamp(20px, 4vw, 34px)
        }
        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 26px
        }
        .panel h2 {
            font-size: clamp(23px, 3vw, 30px);
            margin: 0
        }
        .time {
            padding: 7px 11px;
            border-radius: 99px;
            background: var(--green-soft);
            color: var(--green);
            font-size: 12px;
            font-weight: 800
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 17px
        }
        .field label,
        .settings label {
            display: block;
            color: var(--ink-soft);
            font-size: 13px;
            font-weight: 700
        }
        .field input,
        .field textarea,
        .field select,
        .settings input,
        .settings textarea,
        .quick-note,
        .filter input {
            display: block;
            width: 100%;
            margin-top: 7px;
            padding: 12px 13px;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: #fffefa;
            color: var(--ink);
            font-size: 15px
        }
        .field textarea,
        .settings textarea {
            line-height: 1.45;
            resize: vertical
        }
        .field input:focus,
        .field textarea:focus,
        .field select:focus,
        .settings input:focus,
        .settings textarea:focus,
        .quick-note:focus,
        .filter input:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 4px rgba(47, 143, 104, .1)
        }
        .wide {
            margin-top: 17px
        }
        .primary,
        .secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 0
        }
        .primary {
            color: white;
            background: var(--green);
            box-shadow: 0 8px 20px rgba(47, 143, 104, .18)
        }
        .primary:hover {
            background: #267b59
        }
        .secondary {
            color: var(--ink);
            background: var(--paper);
            border: 1px solid var(--line)
        }
        .next {
            margin-top: 24px;
            margin-right: auto
        }
        .observe-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px
        }
        .observe-head h2 {
            margin: 0;
            font-size: 30px
        }
        .legend {
            display: flex;
            gap: 13px;
            color: var(--ink-soft);
            font-size: 12px;
            font-weight: 700
        }
        .legend span {
            display: flex;
            gap: 5px;
            align-items: center
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block
        }
        .good {
            background: var(--green)
        }
        .watch {
            background: var(--amber)
        }
        .urgent {
            background: var(--red)
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--ink-soft);
            font-weight: 800;
            font-size: 12px;
            letter-spacing: .08em;
            margin: 25px 0 10px
        }
        .section-title:before {
            content: "//";
            color: var(--green);
            letter-spacing: -.12em
        }
        .section-title:after {
            content: "";
            height: 1px;
            flex: 1;
            background: var(--line)
        }
        .criterion {
            position: relative;
            overflow: hidden;
            padding: 17px;
            margin: 10px 0 0;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: rgba(255, 253, 249, .72);
            transition: .18s
        }
        .criterion:before {
            content: "";
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #d8e1db
        }
        .criterion.is-good {
            border-color: #b9ddc9
        }
        .criterion.is-good:before {
            background: var(--green)
        }
        .criterion.is-watch {
            border-color: #efd19e
        }
        .criterion.is-watch:before {
            background: var(--amber)
        }
        .criterion.is-urgent {
            border-color: #efb8b2
        }
        .criterion.is-urgent:before {
            background: var(--red)
        }
        .criterion-top {
            display: flex;
            align-items: flex-start;
            gap: 12px
        }
        .number {
            padding-top: 3px;
            color: #9ca9a5;
            font: 700 11px Rubik
        }
        .criterion h3 {
            font-size: 16px;
            margin: 0
        }
        .criterion p {
            font-size: 13px;
            line-height: 1.4;
            color: var(--ink-soft);
            margin: 4px 0 0
        }
        .status-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 15px
        }
        .status {
            min-height: 43px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fffefa;
            color: var(--ink-soft);
            font-weight: 800;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: .16s
        }
        .status.selected {
            color: white;
            background: var(--ink);
            border-color: var(--ink)
        }
        .is-good .status.selected {
            background: var(--green);
            border-color: var(--green)
        }
        .is-watch .status.selected {
            background: var(--amber);
            border-color: var(--amber)
        }
        .is-urgent .status.selected {
            background: var(--red);
            border-color: var(--red)
        }
        .section-notes-area {
            margin-top: 20px;
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--paper);
            box-shadow: 0 2px 8px rgba(0, 0, 0, .04)
        }
        .section-notes-area h4 {
            font-size: 15px;
            margin: 0 0 10px;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 8px
        }
        .section-notes-area h4 small {
            font-weight: 400;
            font-size: 13px;
            color: var(--ink-soft)
        }
        .note-category-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin: 8px 0
        }
        .note-category-row select {
            padding: 9px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fffefa;
            font-size: 14px;
            flex: 1;
            min-width: 160px
        }
        .note-category-row select:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(47, 143, 104, .12)
        }
        .note-category-row .add-note-btn {
            padding: 9px 16px;
            background: var(--green);
            color: white;
            border: 0;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            white-space: nowrap
        }
        .note-category-row .add-note-btn:active {
            transform: scale(.96)
        }
        .note-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px 12px;
            margin: 6px 0;
            border-radius: 10px;
            background: var(--green-soft);
            border-right: 3px solid var(--green)
        }
        .note-item .note-category {
            font-weight: 700;
            font-size: 13px;
            color: var(--green)
        }
        .note-item .note-text {
            font-size: 14px;
            color: var(--ink);
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word
        }
        .note-item .note-remove {
            background: transparent;
            border: 0;
            color: var(--red);
            font-size: 12px;
            font-weight: 700;
            padding: 2px 6px;
            align-self: flex-start;
            cursor: pointer
        }
        .quick-note {
            display: block;
            width: 100%;
            margin-top: 7px;
            padding: 10px 13px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fffefa;
            color: var(--ink);
            font-size: 14px;
            resize: vertical;
            min-height: 50px;
            border-bottom: 2px solid var(--line)
        }
        .quick-note:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(47, 143, 104, .1)
        }
        .bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 30px
        }
        .bottom>* {
            min-width: 150px
        }
        .summary-hero {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: clamp(23px, 5vw, 40px);
            border-radius: var(--radius);
            background: var(--ink);
            color: white
        }
        .summary-hero:after {
            content: "";
            position: absolute;
            left: -80px;
            top: -150px;
            width: 280px;
            height: 280px;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 50%
        }
        .summary-hero>* {
            position: relative;
            z-index: 1
        }
        .summary-hero .kicker {
            color: #9ed4bb
        }
        .summary-hero h2 {
            font-size: clamp(29px, 4vw, 43px);
            margin: 0
        }
        .summary-hero p {
            max-width: 450px;
            color: #cbd7d5;
            line-height: 1.5;
            margin: 14px 0 0
        }
        .ring {
            width: 100px;
            height: 100px;
            flex: none;
            border: 7px solid #4ea87f;
            border-left-color: rgba(255, 255, 255, .15);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center
        }
        .ring strong {
            font: 800 25px Rubik
        }
        .ring span {
            font-size: 11px;
            color: #cbd7d5
        }
        .summary-grid {
            display: grid;
            grid-template-columns: 1.45fr .8fr;
            gap: 18px;
            margin-top: 18px
        }
        .summary-panel label {
            display: block;
            margin-bottom: 17px
        }
        .summary-side {
            display: flex;
            flex-direction: column;
            gap: 12px
        }
        .stat,
        .safety {
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--paper)
        }
        .stat span {
            color: var(--ink-soft);
            font-size: 12px
        }
        .stat strong {
            display: block;
            font: 800 34px Rubik;
            margin: 4px 0 8px
        }
        .stat strong small {
            color: #a4b0ae;
            font-size: 16px
        }
        .stat p,
        .safety p {
            color: var(--ink-soft);
            font-size: 13px;
            line-height: 1.45;
            margin: 9px 0 0
        }
        .safety {
            display: flex;
            gap: 10px;
            background: #fff8ed;
            border-color: #f0dcb5
        }
        .safety strong {
            color: var(--ink)
        }
        .safety-icon {
            color: var(--amber);
            font-weight: 800
        }
        .settings-intro {
            max-width: 680px;
            color: var(--ink-soft);
            line-height: 1.5;
            margin-bottom: 25px
        }
        .settings-group {
            padding-top: 23px;
            margin-top: 23px;
            border-top: 1px solid var(--line)
        }
        .settings-group h3 {
            font: 700 19px Rubik;
            margin: 0 0 16px
        }
        .settings-item {
            padding: 16px 0;
            border-bottom: 1px dashed var(--line)
        }
        .settings-item:last-child {
            border-bottom: 0
        }
        .settings-number {
            font: 700 11px Rubik;
            color: var(--green);
            margin-bottom: 8px
        }
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 12px
        }
        .history-head {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 24px
        }
        .history-head h2 {
            margin: 0
        }
        .history-head p {
            color: var(--ink-soft);
            margin: 7px 0 0
        }
        .search-wrap {
            position: relative
        }
        #intern-suggestions {
            position: absolute;
            z-index: 10;
            right: 0;
            left: 0;
            top: calc(100% + 5px);
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: 0 14px 30px rgba(24, 51, 59, .14);
            overflow: hidden;
            max-height: 240px;
            overflow-y: auto
        }
        #intern-suggestions:empty {
            display: none
        }
        #intern-suggestions button {
            display: block;
            width: 100%;
            padding: 11px 13px;
            text-align: right;
            border: 0;
            border-bottom: 1px solid var(--line);
            background: var(--paper);
            color: var(--ink)
        }
        #intern-suggestions button:last-child {
            border-bottom: 0
        }
        #intern-suggestions button:hover {
            background: var(--green-soft)
        }
        #intern-suggestions small {
            display: block;
            color: var(--ink-soft);
            font-size: 11px;
            margin-top: 2px
        }
        .upload-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-top: 17px;
            padding: 15px;
            border: 1px dashed #cdbfae;
            border-radius: 14px;
            background: #fbf6ed
        }
        .upload-box strong {
            display: block;
            font-size: 15px
        }
        .upload-box span {
            display: block;
            color: var(--ink-soft);
            font-size: 12px;
            margin-top: 3px
        }
        .upload-button {
            padding: 10px 13px;
            border-radius: 10px;
            background: var(--green-soft);
            color: var(--green);
            font-weight: 800;
            font-size: 13px;

        function read(key, fallback) {
            try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch(e) { return fallback; }
        }
        function write(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
        function esc(value='') { return String(value).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]); }
        function icon() { return '<svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M8 24c3-9 8-14 15-16" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M7 14c5-2 10-1 16 3" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M8 25c6-2 11-2 17 0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>'; }

        function header() {
            return `<header class="topbar"><div class="national-logo-wrap">
                <div class="logo-emblem">
                    <div class="main-title">הפיקוח על <span>החינוך הגופני</span></div>
                    <div class="sub-title">מחוז תל אביב</div>
                    <div class="divider-line"></div>
                </div>
            </div><div class="topbar-inner"><div class="brand"><div class="mark">${icon()}</div><div><strong>מגרש שקט</strong><span>תצפית חנ״ג · 45 דקות</span></div></div><div class="header-actions"><button class="${view==='form'?'active-nav':''}" onclick="go('form')">תצפית חדשה</button><button class="${view==='history'?'active-nav':''}" onclick="go('history')">היסטוריה${history.length?` (${history.length})`:''}</button><button class="${view==='settings'?'active-nav':''}" onclick="go('settings')">הגדרות</button><button class="save-btn" onclick="saveDraft()">שמירה</button></div></div></header>`;
        }

        function shell(content) {
            document.getElementById('app').innerHTML = header() + `<main class="main">${content}</main><footer class="mobile-footer"><span class="live">נשמר אוטומטית במכשיר</span><span>מדריך חנ״ג · HTML</span></footer>`;
        }

        function progress() {
            return Math.round(Object.keys(draft.statuses || {}).length / settings.criteria.length * 100);
        }

        function nav() {
            return `<nav class="nav"><button class="${step==='details'?'active':''}" onclick="setStep('details')"><b>01</b> פרטי שיעור</button><button class="${step==='observe'?'active':''}" onclick="setStep('observe')"><b>02</b> תצפית</button><button class="${step==='summary'?'active':''}" onclick="setStep('summary')"><b>03</b> סיכום ומשוב</button></nav>`;
        }

        // -------- formPage (modified to include the template preview) --------
        function formPage() {
            const pct = progress();
            return `<section class="intro"><div><p class="eyebrow"><span class="field-line"></span> כלי עבודה למדריכים</p><h1>השלב הבא:<br><em>סמן תצפית.</em></h1><p class="intro-copy">עבודה מהירה בשטח: סמן את מה שראית, שמור על רצף השיעור, וסיים עם יעד אחד מעשי.</p></div><div class="session"><div class="session-icon">${icon()}</div><div><span class="session-label">מצב עבודה · שלב ${step==='details'?'01':step==='observe'?'02':'03'}</span><strong>${pct?`תצפית בתהליך · ${Object.keys(draft.statuses).length}/${settings.criteria.length}`:'מוכנים להתחיל'}</strong></div><div class="progress"><i style="width:${pct}%"></i></div><div class="session-meta"><span>0 דק׳</span><span>45 דק׳</span></div></div></section>${nav()}${step==='details'?detailsPage():step==='observe'?observePage():summaryPage()}
            <!-- Template preview added here -->
            <div class="template-preview-wrap">
                <div class="template-preview-header" onclick="toggleTemplatePreview(this)">
                    <span>📋 תצוגת תבנית תצפית (לחץ לפתיחה/סגירה)</span>
                    <span class="toggle-icon">▼</span>
                </div>
                <div class="template-preview-body" id="template-preview-body">
                    <img src="${TEMPLATE_IMAGE}" alt="תבנית תצפית חנ״ג" loading="lazy">
                </div>
            </div>`;
        }

        function toggleTemplatePreview(el) {
            const body = document.getElementById('template-preview-body');
            const icon = el.querySelector('.toggle-icon');
            if (body) {
                body.classList.toggle('open');
                if (icon) icon.classList.toggle('open');
            }
        }

        function detailsPage() {
            return `<section class="panel"><div class="panel-head"><div><p class="kicker">01 / לפני השיעור</p><h2>פרטי השיעור</h2></div><span class="time">כ־2 דקות</span></div><div class="grid field"><label>שם הסטאז׳ר/ית<div class="search-wrap"><input value="${esc(draft.name)}" onfocus="searchInterns(this.value)" oninput="searchInterns(this.value)" placeholder="חיפוש לפי שם פרטי או משפחה" autocomplete="off"><div id="intern-suggestions"></div></div></label><label>מדריך/ה<input value="${esc(draft.mentor||'')}" readonly placeholder="ישויך אוטומטית לאחר בחירה"></label><label>טלפון<input value="${esc(draft.phone||'')}" readonly placeholder="יתמלא אוטומטית לאחר בחירה"></label><label>תאריך<input type="date" value="${esc(draft.date)}" oninput="setField('date',this.value)"></label><label>שם בית הספר<input value="${esc(draft.school||'')}" readonly placeholder="יתמלא אוטומטית לאחר בחירה"></label><label>סוג בית הספר<input value="${esc(draft.schoolType||'')}" readonly placeholder="יתמלא אוטומטית לאחר בחירה"></label><label>עיר בית הספר<input value="${esc(draft.city||'')}" readonly placeholder="יתמלא אוטומטית לאחר בחירה"></label><label>כיתה<input value="${esc(draft.className||'')}" oninput="setField('className',this.value)" placeholder="למשל: י׳2"></label><label>מספר תלמידים<input type="number" min="0" value="${esc(draft.studentCount||'')}" oninput="setField('studentCount',this.value)" placeholder="למשל: 28"></label><label>נושא השיעור<input value="${esc(draft.topic)}" oninput="setField('topic',this.value)" placeholder="למשל: מסירת כדור בתנועה"></label><label>מקום השיעור<select onchange="setField('lessonPlace',this.value);render()"><option value="">בחירה</option><option value="אולם" ${draft.lessonPlace==='אולם'?'selected':''}>אולם</option><option value="מגרש" ${draft.lessonPlace==='מגרש'?'selected':''}>מגרש</option><option value="אחר" ${draft.lessonPlace==='אחר'?'selected':''}>אחר</option></select>${draft.lessonPlace==='אחר'?`<input value="${esc(draft.lessonPlaceOther||'')}" oninput="setField('lessonPlaceOther',this.value)" placeholder="כתוב את מקום השיעור">`:''}</label><label>מספר שיעור מתוך יחידת ההוראה<select onchange="setField('unitLesson',this.value);render()"><option value="">בחירה</option><option value="1" ${draft.unitLesson==='1'?'selected':''}>1</option><option value="2" ${draft.unitLesson==='2'?'selected':''}>2</option><option value="3" ${draft.unitLesson==='3'?'selected':''}>3</option><option value="4" ${draft.unitLesson==='4'?'selected':''}>4</option><option value="5" ${draft.unitLesson==='5'?'selected':''}>5</option><option value="לא צוין" ${draft.unitLesson==='לא צוין'?'selected':''}>לא צוין</option><option value="אחר" ${draft.unitLesson==='אחר'?'selected':''}>אחר</option></select>${draft.unitLesson==='אחר'?`<input value="${esc(draft.unitLessonOther||'')}" oninput="setField('unitLessonOther',this.value)" placeholder="כתוב מספר או תיאור אחר">`:''}</label></div><div class="upload-box"><div><strong>מערך שיעור</strong><span>אפשר להעלות PDF, Word, PowerPoint או קובץ טקסט</span></div>${draft.lessonFile?`<div class="file-chip"><span>${esc(draft.lessonFile.name)} · ${formatSize(draft.lessonFile.size)}</span><button type="button" onclick="removeLessonFile()">הסרה</button></div>`:'<label class="upload-button">בחירת קובץ<input type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.odt,.txt,.md" onchange="attachLessonFile(this.files[0])"></label>'}</div><label class="field wide">מטרת השיעור<textarea rows="3" oninput="setField('goal',this.value)" placeholder="מה התלמידים אמורים לדעת או לבצע בסיום?">${esc(draft.goal)}</textarea></label><button class="primary next" onclick="setStep('observe')">התחלת תצפית ←</button></section>`;
        }

        function grouped() {
            return settings.criteria.reduce((a,c) => { (a[c.section]??=[]).push(c); return a; }, {});
        }

        function observePage() {
            let groups = grouped();
            let body = Object.entries(groups).map(([section, items]) =>
                `<div class="section-title">${esc(section)}</div>${items.map((c,i) => criterion(c,i)).join('')}`
            ).join('');

            const noteSections = SECTION_KEYS.map(key => {
                const label = SECTION_LABELS[key];
                const notes = draft.sectionNotes?.[key] || [];
                return `<div class="section-notes-area"><h4>${esc(label)} — הערות לשימור/שיפור <small>בחר קטגוריה והוסף הערה</small></h4>
                <div class="note-category-row">
                    <select id="note-cat-${key}" onchange="updateTempNote('${key}','category',this.value)">
                        <option value="">בחר קטגוריה…</option>${NOTE_CATEGORIES.map(cat => `<option value="${esc(cat)}">${esc(cat)}</option>`).join('')}
                    </select>
                    <button class="add-note-btn" onclick="addSectionNote('${key}')">+ הוסף הערה</button>
                </div>
                <div class="note-category-row">
                    <textarea id="note-text-${key}" class="quick-note" rows="2" placeholder="כתוב את ההערה שלך כאן…" oninput="updateTempNote('${key}','text',this.value)">${esc(draft.tempNote?.[key]?.text || '')}</textarea>
                </div>
                <div id="note-list-${key}">${notes.map((n,i) => `<div class="note-item"><div class="note-category">${esc(n.category)}</div><div class="note-text">${esc(n.text)}</div><button class="note-remove" onclick="removeSectionNote('${key}',${i})">✕ הסר</button></div>`).join('')}</div>
                </div>`;
            }).join('');

            return `<section><div class="observe-head"><div><p class="kicker">02 / בזמן השיעור</p><h2>סמן. המשך לצפות.</h2></div><div class="legend"><span><i class="dot good"></i>מתקיים</span><span><i class="dot watch"></i>שימור/שיפור</span></div></div>${body}${noteSections}<div class="bottom"><button class="secondary" onclick="setStep('details')">→ פרטי שיעור</button><button class="primary" onclick="setStep('summary')">סיכום ומשוב ←</button></div></section>`;
        }

        function criterion(c, i) {
            const selected = draft.statuses[c.id] || '';
            return `<article class="criterion ${selected?'is-'+selected:''}"><div class="criterion-top"><span class="number">${String(i+1).padStart(2,'0')}</span><div><h3>${esc(c.title)}</h3><p>${esc(c.hint)}</p></div></div><div class="status-row">${[['good','מתקיים'],['watch','שימור/שיפור']].map(([s,label])=>`<button class="status ${selected===s?'selected':''}" onclick="setStatus('${c.id}','${s}')"><i class="dot ${s}"></i>${label}</button>`).join('')}</div><input class="quick-note" value="${esc(draft.notes[c.id]||'')}" oninput="setNote('${c.id}',this.value)" placeholder="הערה קצרה — מה ראית בפועל?"></article>`;
        }

        function summaryPage() {
            const pct = progress();
            const urgent = Object.values(draft.statuses).filter(x => x === 'watch').length;
            return `<section><div class="summary-hero"><div><p class="kicker">03 / אחרי השיעור</p><h2>תמונה ברורה<br><em>להמשך הדרך.</em></h2><p>המשוב הטוב ביותר נשען על שתי ראיות ועל יעד אחד שאפשר לבצע כבר בשיעור הבא.</p></div><div class="ring"><strong>${pct}%</strong><span>הושלם</span></div></div><div class="summary-grid"><div class="panel summary-panel"><div class="panel-head"><div><p class="kicker">הערות מדריך</p><h2>משוב קצר ומעשי</h2></div></div><label class="field">${esc(settings.feedback.strengthsLabel)}<textarea rows="3" oninput="setField('strengths',this.value)" placeholder="${esc(settings.feedback.strengthsPlaceholder)}">${esc(draft.strengths)}</textarea></label><label class="field">${esc(settings.feedback.improvementLabel)}<textarea rows="3" oninput="setField('improvement',this.value)" placeholder="${esc(settings.feedback.improvementPlaceholder)}">${esc(draft.improvement)}</textarea></label><label class="field">${esc(settings.feedback.nextGoalLabel)}<textarea rows="3" oninput="setField('nextGoal',this.value)" placeholder="${esc(settings.feedback.nextGoalPlaceholder)}">${esc(draft.nextGoal)}</textarea></label></div><aside class="summary-side"><div class="attached-summary">${draft.lessonFile?`<strong>מערך שיעור מצורף</strong><span>${esc(draft.lessonFile.name)} · ${formatSize(draft.lessonFile.size)}</span><button class="secondary" onclick="downloadLessonFile()">הורדת הקובץ</button>`:'<strong>אין מערך שיעור מצורף</strong><span>אפשר להוסיף אותו בשלב פרטי השיעור.</span>'}</div><div class="stat"><span>מדדים שסומנו</span><strong>${Object.keys(draft.statuses).length}<small> / ${settings.criteria.length}</small></strong><div class="progress"><i style="width:${pct}%"></i></div></div><div class="stat"><span>דורשים תשומת לב (שימור/שיפור)</span><strong style="color:${urgent?'var(--amber)':'inherit'}">${urgent}</strong><p>${urgent?'כדאי להתייחס אליהם בשיחת המשוב.':'אין מדדים שסומנו כשימור/שיפור.'}</p></div><div class="safety"><div class="safety-icon">!</div><p><strong>זכור:</strong> אירוע בטיחותי או יחס בלתי הולם מחייבים התייחסות נפרדת, גם אם הציון הכללי גבוה.</p></div></aside></div><div class="bottom"><button class="secondary" onclick="setStep('observe')">→ חזרה לתצפית</button><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="secondary" onclick="exportPDF()">PDF</button><button class="whatsapp-share-btn" onclick="shareWhatsapp()">📱 WhatsApp</button><button class="primary" onclick="saveObservation()">שמירת תצפית</button></div></div></section>`;
        }

        function aggregateStats(list, key) {
            const map = {};
            list.forEach(x => {
                const label = key(x) || 'לא שויך';
                if (!map[label]) map[label] = { label, count: 0, total: 0, attention: 0 };
                const count = Object.keys(x.statuses || {}).length;
                const pct = Math.round(count / settings.criteria.length * 100);
                map[label].count += 1;
                map[label].total += pct;
                map[label].attention += Object.values(x.statuses || {}).filter(s => s === 'watch').length;
            });
            return Object.values(map).map(x => ({ ...x, avg: Math.round(x.total / x.count) })).sort((a,b) => b.count - a.count || b.avg - a.avg);
        }

        function statRows(rows) {
            return rows.length ? rows.map(x => `<div class="stats-row"><div class="stats-row-top"><strong>${esc(x.label)}</strong><span>${x.count} תצפיות · ${x.avg}%</span></div><div class="bar-track"><i style="width:${x.avg}%"></i></div><small>${x.attention} מדדי שימור/שיפור</small></div>`).join('') : '<div class="stats-empty">אין מספיק נתונים להצגה.</div>';
        }

        function statsBlock(list) {
            const total = list.length;
            const completion = total ? Math.round(list.reduce((sum,x) => sum + Math.round(Object.keys(x.statuses||{}).length / settings.criteria.length * 100), 0) / total) : 0;
            const attention = list.reduce((sum,x) => sum + Object.values(x.statuses||{}).filter(s => s === 'watch').length, 0);
            const mentors = aggregateStats(list, x => x.mentor);
            const interns = aggregateStats(list, x => x.name);
            const schools = aggregateStats(list, x => x.school);
            return `<div class="stats-panel"><div class="stats-title"><div><h3>לוח סיכום תצפיות</h3><p>הסיכום מתעדכן לפי החיפוש וטווח התאריכים שבחרת.</p></div><span class="time">${total} תצפיות</span></div><div class="stats-cards"><div class="stat-card"><span>תצפיות</span><strong>${total}</strong></div><div class="stat-card"><span>השלמת מדדים ממוצעת</span><strong>${completion}%</strong></div><div class="stat-card"><span>מדדי שימור/שיפור</span><strong>${attention}</strong></div></div><div class="stats-columns"><div class="stats-column"><h4>לפי מדריך/ה</h4>${statRows(mentors)}</div><div class="stats-column"><h4>לפי סטאז׳ר/ית</h4>${statRows(interns)}</div><div class="stats-column"><h4>לפי בית ספר</h4>${statRows(schools)}</div></div></div>`;
        }

        function csvCell(value) { const text = String(value??'').replace(/"/g,'""'); return `"${text}"`; }

        function exportExcel() {
            if (!history.length) { alert('אין עדיין תצפיות לייצוא.'); return; }
            const rows = history.map(x => {
                const count = Object.keys(x.statuses||{}).length;
                const pct = Math.round(count / settings.criteria.length * 100);
                const row = {
                    'תאריך': x.date||'',
                    'שם הסטאז׳ר/ית': x.name||'',
                    'מדריך/ה': x.mentor||'',
                    'טלפון': x.phone||'',
                    'שם בית הספר': x.school||'',
                    'סוג בית הספר': x.schoolType||'',
                    'עיר בית הספר': x.city||'',
                    'כיתה': x.className||'',
                    'מספר תלמידים': x.studentCount||'',
                    'נושא השיעור': x.topic||'',
                    'מקום השיעור': x.lessonPlace==='אחר'?(x.lessonPlaceOther||'אחר'):(x.lessonPlace||''),
                    'מספר שיעור ביחידת ההוראה': x.unitLesson==='אחר'?(x.unitLessonOther||'אחר'):(x.unitLesson||''),
                    'מערך שיעור': x.lessonFile?.name||'',
                    'השלמת מדדים': `${pct}%`,
                    'מדדים שסומנו': count,
                    'מדדי שימור/שיפור': Object.values(x.statuses||{}).filter(s=>s==='watch').length,
                    'חוזקות': x.strengths||'',
                    'נקודת שיפור': x.improvement||'',
                    'יעד לשיעור הבא': x.nextGoal||''
                };
                settings.criteria.forEach(c => {
                    row[`${c.title} — סטטוס`] = x.statuses?.[c.id] || '';
                    row[`${c.title} — הערה`] = x.notes?.[c.id] || '';
                });
                return row;
            });
            const filename = `תצפיות_חנ״ג_${new Date().toISOString().slice(0,10)}`;
            if (window.XLSX) {
                const ws = XLSX.utils.json_to_sheet(rows);
                ws['!cols'] = Object.keys(rows[0]).map(() => ({ wch: 22 }));
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'תצפיות');
                XLSX.writeFile(wb, `${filename}.xlsx`);
                toast('קובץ Excel נוצר בהצלחה');
                return;
            }
            const headers = Object.keys(rows[0]);
            const csv = '\uFEFF' + [headers, ...rows.map(row => headers.map(h => row[h]??''))].map(line => line.map(csvCell).join(',')).join('\r\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${filename}.csv`;
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            toast('קובץ CSV נוצר בהצלחה — ניתן לפתוח אותו ב־Excel');
        }

        function historyPage() {
            const list = history.filter(x => {
                const n = (x.name||'').toLowerCase().includes(historyQuery.toLowerCase());
                const d = (!historyFrom || x.date >= historyFrom) && (!historyTo || x.date <= historyTo);
                return n && d;
            });
            return `<section class="panel"><div class="history-head"><div><p class="kicker">ארכיון תצפיות</p><h2>היסטוריה</h2><p>כל התצפיות שנשמרו במכשיר הזה — כל המדריכים רואים הכל.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" onclick="exportExcel()">ייצוא Excel</button><button class="secondary" onclick="loadCloudHistory()">סנכרון ענן</button><button class="primary" onclick="newObservation()">+ תצפית חדשה</button></div></div><div class="filter"><input placeholder="חיפוש לפי שם סטאז׳ר/ית" value="${esc(historyQuery)}" oninput="filterHistory('query',this.value)"><input type="date" value="${esc(historyFrom)}" onchange="filterHistory('from',this.value)" aria-label="מתאריך"><input type="date" value="${esc(historyTo)}" onchange="filterHistory('to',this.value)" aria-label="עד תאריך"></div>${statsBlock(list)}<div class="history-list">${list.length ? list.map(historyCard).join('') : '<div class="empty">אין עדיין תצפיות התואמות לחיפוש.<br>לאחר שמירת תצפית היא תופיע כאן.</div>'}</div></section>`;
        }

        function historyCard(x) {
            const count = Object.keys(x.statuses||{}).length;
            const p = Math.round(count / settings.criteria.length * 100);
            return `<article class="history-card"><div><h3>${esc(x.name||'ללא שם')}</h3><p>${esc(x.date||'')} · ${esc(x.className||'')} · ${esc(x.topic||'')} · מדריך/ה: ${esc(x.mentor||'לא שויך')} · ${esc(x.schoolType||'')} · ${esc(x.lessonPlace==='אחר'?(x.lessonPlaceOther||'אחר'):x.lessonPlace||'מקום לא צוין')}${x.lessonFile?' · מערך מצורף':''}</p></div><div class="mini-score"><strong>${p}%</strong><span>${count}/${settings.criteria.length} מדדים</span></div><div style="display:flex;gap:7px"><button class="secondary" onclick="loadObservation('${x.id}')">פתיחה</button><button class="secondary" onclick="deleteObservation('${x.id}')">מחיקה</button></div></article>`;
        }

        function settingsPage() {
            return `<section class="panel settings"><p class="kicker">התאמה אישית</p><h2>הגדרות הטופס</h2><p class="settings-intro">ערוך את שמות המדדים, טקסטי העזר והניסוחים שיופיעו למדריך בזמן המילוי. השינויים נשמרים במכשיר וישפיעו על תצפיות חדשות וקיימות בתצוגה.</p><div class="settings-group"><h3>מדדי התצפית</h3>${settings.criteria.map((c,i)=>`<div class="settings-item"><div class="settings-number">מדד ${String(i+1).padStart(2,'0')}</div><div class="settings-grid"><label>שם המדד<input value="${esc(c.title)}" oninput="setSettingCriterion(${i},'title',this.value)"></label><label>טקסט עזר<input value="${esc(c.hint)}" oninput="setSettingCriterion(${i},'hint',this.value)"></label></div></div>`).join('')}</div><div class="settings-group"><h3>שמירת נתונים</h3><p class="settings-intro" style="margin-bottom:14px">כברירת מחדל הנתונים נשמרים במכשיר. אפשר להגדיר כתובת API של השירות שלך כדי לשלוח ולקבל תצפיות בענן. אין לשמור כאן מפתחות סודיים; השתמש באימות בצד השרת.</p><label>כתובת API בסיסית<input value="${esc(settings.cloud?.baseUrl||'')}" oninput="setCloud('baseUrl',this.value)" placeholder="https://example.com/api"></label><label style="display:flex;align-items:center;gap:8px;margin-top:14px"><input style="width:auto;margin:0" type="checkbox" ${settings.cloud?.autoSync?'checked':''} onchange="setCloud('autoSync',this.checked)"> סנכרון אוטומטי בעת שמירת תצפית</label><div style="margin-top:12px;padding:12px;border-radius:11px;background:#f8f3ea;color:var(--ink-soft);font-size:12px;line-height:1.5">החיבור משתמש ב־<strong>GET /observations</strong> לקריאה וב־<strong>POST /observations</strong> לשמירה. בשלב זה מערך השיעור נשמר מקומית; ל־API נשלחים פרטי הקובץ בלבד.</div></div><div class="settings-group"><h3>נוסחי המשוב</h3><div class="settings-grid"><label>כותרת חוזקות<input value="${esc(settings.feedback.strengthsLabel)}" oninput="setFeedback('strengthsLabel',this.value)"></label><label>טקסט עזר לחוזקות<input value="${esc(settings.feedback.strengthsPlaceholder)}" oninput="setFeedback('strengthsPlaceholder',this.value)"></label><label>כותרת נקודת שיפור<input value="${esc(settings.feedback.improvementLabel)}" oninput="setFeedback('improvementLabel',this.value)"></label><label>טקסט עזר לנקודת שיפור<input value="${esc(settings.feedback.improvementPlaceholder)}" oninput="setFeedback('improvementPlaceholder',this.value)"></label><label>כותרת יעד<input value="${esc(settings.feedback.nextGoalLabel)}" oninput="setFeedback('nextGoalLabel',this.value)"></label><label>טקסט עזר ליעד<input value="${esc(settings.feedback.nextGoalPlaceholder)}" oninput="setFeedback('nextGoalPlaceholder',this.value)"></label></div></div><div class="bottom"><button class="secondary" onclick="resetSettings()">איפוס לברירת מחדל</button><button class="primary" onclick="saveSettings()">שמירת הגדרות</button></div></section>`;
        }

        function render() {
            shell(view === 'form' ? formPage() : view === 'history' ? historyPage() : settingsPage());
        }

        function go(v) { view = v; if (v === 'form') step = 'details'; render(); }
        function setStep(s) { step = s; view = 'form'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

        function normalizeText(value) {
            return String(value||'').trim().toLocaleLowerCase('he-IL').replace(/[׳״]/g,'').replace(/\s+/g,' ');
        }

        function searchInterns(query) {
            const box = document.getElementById('intern-suggestions');
            if (!box) return;
            const q = normalizeText(query);
            const matches = INTERN_DATA.filter(x => !q || normalizeText(x.fullName).includes(q) || normalizeText(x.firstName).includes(q) || normalizeText(x.lastName).includes(q)).slice(0, 8);
            box.innerHTML = matches.map(x => `<button type="button" onclick="chooseIntern('${x.id}')"><strong>${esc(x.fullName)}</strong><small>מדריך/ה: ${esc(x.mentor)} · ${esc(x.school||'')}</small></button>`).join('');
        }

        function chooseIntern(id) {
            const intern = INTERN_DATA.find(x => x.id === id);
            if (!intern) return;
            draft.internId = intern.id;
            draft.name = intern.fullName;
            draft.mentor = intern.mentor;
            draft.phone = intern.phone || '';
            draft.school = intern.school || '';
            draft.schoolType = intern.schoolType || '';
            draft.city = intern.city || '';
            write('pe-draft', draft);
            render();
            toast(`נבחר/ה ${intern.fullName} · מדריך/ה ${intern.mentor}`);
        }

        function setField(k, v) { draft[k] = v; write('pe-draft', draft); }

        function formatSize(bytes) {
            if (!bytes) return '0 KB';
            return bytes < 1048576 ? Math.round(bytes/1024) + ' KB' : (bytes/1048576).toFixed(1) + ' MB';
        }

        function attachLessonFile(file) {
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) { toast('הקובץ גדול מדי. ניתן להעלות עד 5MB'); return; }
            const reader = new FileReader();
            reader.onload = () => {
                draft.lessonFile = { name: file.name, size: file.size, type: file.type, data: reader.result };
                write('pe-draft', draft);
                render();
                toast('מערך השיעור צורף לתצפית');
            };
            reader.readAsDataURL(file);
        }

        function removeLessonFile() { draft.lessonFile = null; write('pe-draft', draft); render(); toast('מערך השיעור הוסר'); }
        function downloadLessonFile() {
            if (!draft.lessonFile) return;
            const a = document.createElement('a');
            a.href = draft.lessonFile.data;
            a.download = draft.lessonFile.name;
            a.click();
        }

        function setStatus(id, s) {
            draft.statuses[id] = draft.statuses[id] === s ? undefined : s;
            if (!draft.statuses[id]) delete draft.statuses[id];
            write('pe-draft', draft);
            render();
        }

        function setNote(id, v) { draft.notes[id] = v; write('pe-draft', draft); }

        function updateTempNote(key, field, value) {
            if (!draft.tempNote) draft.tempNote = { warmup: { category: '', text: '' }, main: { category: '', text: '' }, close: { category: '', text: '' } };
            draft.tempNote[key][field] = value;
            write('pe-draft', draft);
        }

        function addSectionNote(key) {
            if (!draft.tempNote) draft.tempNote = { warmup: { category: '', text: '' }, main: { category: '', text: '' }, close: { category: '', text: '' } };
            const cat = draft.tempNote[key]?.category || '';
            const text = draft.tempNote[key]?.text || '';
            if (!cat) { toast('יש לבחור קטגוריה'); return; }
            if (!text.trim()) { toast('יש לכתוב הערה'); return; }
            if (!draft.sectionNotes) draft.sectionNotes = { warmup: [], main: [], close: [] };
            draft.sectionNotes[key].push({ category: cat, text: text.trim() });
            draft.tempNote[key] = { category: '', text: '' };
            write('pe-draft', draft);
            render();
            setTimeout(() => {
                const sel = document.getElementById(`note-cat-${key}`);
                if (sel) sel.value = '';
                const ta = document.getElementById(`note-text-${key}`);
                if (ta) ta.value = '';
            }, 50);
            toast('הערה נוספה');
        }

        function removeSectionNote(key, index) {
            if (!draft.sectionNotes) return;
            draft.sectionNotes[key].splice(index, 1);
            write('pe-draft', draft);
            render();
            toast('הערה הוסרה');
        }

        function saveDraft() { write('pe-draft', draft); toast('הטיוטה נשמרה במכשיר'); }

        function newObservation() {
            draft = blankDraft();
            write('pe-draft', draft);
            view = 'form';
            step = 'details';
            render();
            toast('נפתחה תצפית חדשה — נקייה מנתונים קודמים');
        }

        async function saveObservation() {
            if (!draft.name.trim()) { toast('נא למלא שם סטאז׳ר/ית לפני השמירה'); return; }
            const item = { ...draft, id: Date.now().toString(), savedAt: new Date().toISOString() };
            history = [item, ...history.filter(x => x.id !== item.id)];
            write('pe-history', history);
            try {
                if (settings.cloud?.autoSync && settings.cloud.baseUrl) {
                    await syncToCloud(item);
                    toast('✅ התצפית נשמרה מקומית ובענן');
                } else {
                    toast('✅ התצפית נשמרה בהיסטוריה המקומית');
                }
            } catch(e) {
                toast('✅ נשמר מקומית; הסנכרון לענן נכשל');
            }
            setTimeout(() => {
                if (confirm('לשלוח את סיכום התצפית בוואטסאפ לסטאז׳ר/ית?')) {
                    shareWhatsapp();
                }
            }, 400);
            setTimeout(() => { view = 'history'; render(); }, 650);
        }

        function loadObservation(id) {
            const x = history.find(v => v.id === id);
            if (!x) return;
            draft = { ...x, statuses: { ...x.statuses }, notes: { ...x.notes }, sectionNotes: { ...(x.sectionNotes || { warmup: [], main: [], close: [] }) }, tempNote: { warmup: { category: '', text: '' }, main: { category: '', text: '' }, close: { category: '', text: '' } } };
            write('pe-draft', draft);
            view = 'form';
            step = 'summary';
            render();
        }

        function deleteObservation(id) {
            if (!confirm('למחוק את התצפית מההיסטוריה?')) return;
            history = history.filter(x => x.id !== id);
            write('pe-history', history);
            render();
            toast('התצפית נמחקה');
        }

        function filterHistory(k, v) {
            if (k === 'query') historyQuery = v;
            if (k === 'from') historyFrom = v;
            if (k === 'to') historyTo = v;
            render();
        }

        function setSettingCriterion(i, k, v) { settings.criteria[i][k] = v; }
        function setFeedback(k, v) { settings.feedback[k] = v; }
        function setCloud(k, v) { settings.cloud = settings.cloud || { baseUrl: '', autoSync: false }; settings.cloud[k] = v; }

        async function syncToCloud(item) {
            if (!settings.cloud?.baseUrl) return false;
            const base = settings.cloud.baseUrl.replace(/\/$/,'');
            const payload = { ...item, lessonFile: item.lessonFile ? { name: item.lessonFile.name, size: item.lessonFile.size, type: item.lessonFile.type } : null };
            const response = await fetch(base + '/observations', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!response.ok) throw new Error('Cloud save failed');
            return true;
        }

        async function loadCloudHistory() {
            if (!settings.cloud?.baseUrl) { toast('הגדר כתובת API במסך ההגדרות'); return; }
            try {
                toast('טוען תצפיות מהענן…');
                const base = settings.cloud.baseUrl.replace(/\/$/,'');
                const response = await fetch(base + '/observations');
                if (!response.ok) throw new Error('Cloud load failed');
                const cloudItems = await response.json();
                if (!Array.isArray(cloudItems)) throw new Error('Invalid response');
                history = [...cloudItems, ...history.filter(local => !cloudItems.some(cloud => cloud.id === local.id))];
                write('pe-history', history);
                render();
                toast(`${cloudItems.length} תצפיות נטענו מהענן`);
            } catch(e) {
                toast('לא ניתן לטעון מהענן; הנתונים המקומיים נשמרו');
            }
        }

        function saveSettings() { write('pe-settings', settings); render(); toast('ההגדרות נשמרו'); }
        function resetSettings() {
            if (!confirm('לאפס את כל המדדים ונוסחי המשוב לברירת המחדל?')) return;
            settings = JSON.parse(JSON.stringify(defaultSettings));
            write('pe-settings', settings);
            render();
            toast('ההגדרות אופסו');
        }

        function toast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(window._toast);
            window._toast = setTimeout(() => el.classList.remove('show'), 2400);
        }

        function pdfData() {
            const statusLabel = { good: 'מתקיים', watch: 'שימור/שיפור' };
            const noteSectionsHtml = SECTION_KEYS.map(key => {
                const notes = draft.sectionNotes?.[key] || [];
                if (!notes.length) return '';
                return `<div style="margin-top:12px;padding:10px;border:1px solid #e7ded0;border-radius:8px;background:#f8f3ea"><strong>${SECTION_LABELS[key]} — הערות לשימור/שיפור</strong>${notes.map(n => `<div style="margin:4px 0"><span style="font-weight:700;color:#2f8f68">${esc(n.category)}:</span> ${esc(n.text)}</div>`).join('')}</div>`;
            }).join('');
            return `<div style="display:flex;justify-content:space-between;align-items:flex-start"><div><p style="margin:0;color:#2f8f68;font-weight:800;font-size:12px;letter-spacing:.1em">כלי עבודה למדריכים</p><h1>סיכום תצפית חנ״ג</h1><p style="margin:0;color:#607378">מגרש שקט · שיעור תיכון בן 45 דקות</p></div><div style="color:#2f8f68;font-weight:800">${new Date().toLocaleDateString('he-IL')}</div></div><div class="pdf-meta"><div class="pdf-row"><strong>סטאז׳ר/ית</strong><span>${esc(draft.name)||'—'}</span></div><div class="pdf-row"><strong>מדריך/ה</strong><span>${esc(draft.mentor)||'—'}</span></div><div class="pdf-row"><strong>טלפון</strong><span>${esc(draft.phone)||'—'}</span></div><div class="pdf-row"><strong>בית ספר</strong><span>${esc(draft.school)||'—'}</span></div><div class="pdf-row"><strong>סוג בית ספר</strong><span>${esc(draft.schoolType)||'—'}</span></div><div class="pdf-row"><strong>עיר</strong><span>${esc(draft.city)||'—'}</span></div><div class="pdf-row"><strong>תאריך השיעור</strong><span>${esc(draft.date)||'—'}</span></div><div class="pdf-row"><strong>כיתה</strong><span>${esc(draft.className)||'—'}</span></div><div class="pdf-row"><strong>מספר תלמידים</strong><span>${esc(draft.studentCount)||'—'}</span></div><div class="pdf-row"><strong>מקום שיעור</strong><span>${esc(draft.lessonPlace==='אחר'?(draft.lessonPlaceOther||'אחר'):draft.lessonPlace)||'—'}</span></div><div class="pdf-row"><strong>שיעור ביחידת ההוראה</strong><span>${esc(draft.unitLesson==='אחר'?(draft.unitLessonOther||'אחר'):draft.unitLesson)||'—'}</span></div><div class="pdf-row"><strong>נושא</strong><span>${esc(draft.topic)||'—'}</span></div><div class="pdf-row"><strong>מטרת השיעור</strong><span>${esc(draft.goal)||'—'}</span></div></div><h2 style="font-size:20px;margin:20px 0 6px">מדדי התצפית</h2>${settings.criteria.map((c,i)=>`<div class="pdf-criterion"><strong>${String(i+1).padStart(2,'0')}. ${esc(c.title)}</strong><span>${draft.statuses[c.id]?statusLabel[draft.statuses[c.id]]:'לא סומן'}${draft.notes[c.id]?' · '+esc(draft.notes[c.id]):''}</span></div>`).join('')}${noteSectionsHtml}<div class="pdf-summary"><h2>${esc(settings.feedback.strengthsLabel)}</h2><p>${esc(draft.strengths)||'—'}</p><h2>${esc(settings.feedback.improvementLabel)}</h2><p>${esc(draft.improvement)||'—'}</p><h2>${esc(settings.feedback.nextGoalLabel)}</h2><p>${esc(draft.nextGoal)||'—'}</p></div>`;
        }

        async function makePDF() {
            const sheet = document.getElementById('pdf-sheet');
            sheet.innerHTML = pdfData();
            const canvas = await html2canvas(sheet, { scale: 2, backgroundColor: '#fffdf9', useCORS: true });
            const img = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
            const pageW = 210, pageH = 297;
            const imgH = canvas.height * pageW / canvas.width;
            let y = 0;
            while (y < imgH) {
                if (y > 0) pdf.addPage();
                pdf.addImage(img, 'PNG', 0, -y, pageW, imgH);
                y += pageH;
            }
            return pdf;
        }

        async function exportPDF() {
            try {
                toast('מכין קובץ PDF…');
                const pdf = await makePDF();
                pdf.save(`סיכום-תצפית-${draft.name||'חנג'}.pdf`);
                toast('קובץ ה־PDF הורד בהצלחה');
            } catch(e) {
                toast('לא ניתן ליצור PDF בדפדפן זה');
            }
        }

        async function shareWhatsapp() {
            try {
                toast('מכין קובץ לשיתוף…');
                const pdf = await makePDF();
                const blob = pdf.output('blob');
                const filename = `סיכום-תצפית-${draft.name||'חנג'}.pdf`;
                const file = new File([blob], filename, { type: 'application/pdf' });
                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ title: 'סיכום תצפית חנ״ג', text: `סיכום תצפית עבור ${draft.name||'הסטאז׳ר/ית'}`, files: [file] });
                    return;
                }
                const phone = (draft.phone || '').replace(/[^0-9]/g, '').replace(/^0/, '972');
                const text = encodeURIComponent(`שלום ${draft.name||''}, מצורף סיכום התצפית בשיעור החנ״ג.`);
                window.open(phone ? `https://wa.me/${phone}?text=${text}` : `https://wa.me/?text=${text}`, '_blank');
                pdf.save(filename);
                toast('WhatsApp נפתח; הקובץ נשמר לצירוף');
            } catch(e) {
                toast('השיתוף בוטל או אינו נתמך; אפשר להוריד PDF במקום');
            }
        }

        render();
    </script>
</body>
</html>
